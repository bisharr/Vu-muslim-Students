<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Charset & viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>VUMSA — Victoria University Muslim Students Association</title>
    <meta
      name="description"
      content="VUMSA connects Muslim students with events, resources, prayer times, and community support at Victoria University."
    />
    <meta
      name="keywords"
      content="VUMSA, Muslim students, Victoria University, Islamic events, prayer times, community, Uganda"
    />
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon-new.jpeg" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Optional PWA manifest (add if you have one) -->
    <!-- <link rel="manifest" href="/manifest.webmanifest" /> -->

    <!-- Theme colors (mobile address bar color) -->
    <meta name="theme-color" content="#0B5ED7" />
    <meta name="msapplication-TileColor" content="#0B5ED7" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta
      property="og:title"
      content="VUMSA — Victoria University Muslim Students Association"
    />
    <meta
      property="og:description"
      content="Discover events, prayer times, resources, and ways to get involved with the Muslim student community."
    />
    <meta property="og:image" content="https://your-domain.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="VUMSA — Victoria University Muslim Students Association"
    />
    <meta
      name="twitter:description"
      content="Events, resources, prayer times, and community for Muslim students at Victoria University."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.jpg" />

    <!-- Performance (optional, safe to keep) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />

    <!-- Structured Data (Organization + Website) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "VUMSA",
        "url": "https://vumsa.online/",
        "logo": "https://vumsa.online/favicon-new.jpeg",
        "sameAs": []
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "VUMSA",
        "url": "https://your-domain.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://your-domain.com/search?q={query}",
          "query-input": "required name=query"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
